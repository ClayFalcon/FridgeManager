<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>食品保管画面 — FridgeManager</title>
  <style>
    :root {
      --bg: #e8f4f0;
      --surface: #ffffff;
      --text: #1a2e2a;
      --muted: #5c7a72;
      --accent: #0d8f7a;
      --accent-soft: #c5ebe2;
      --danger: #c73e3e;
      --danger-soft: #fde8e8;
      --tag-bg: #eef6f3;
      --shadow: 0 2px 12px rgba(13, 47, 40, 0.08);
      --radius: 14px;
      --font: system-ui, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      background: linear-gradient(165deg, #d4ebe4 0%, var(--bg) 45%, #dceef5 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 32px;
    }

    .phone {
      width: 100%;
      max-width: 400px;
      min-height: min(720px, 100dvh - 48px);
      background: var(--surface);
      border-radius: 28px;
      box-shadow: var(--shadow), 0 24px 48px rgba(13, 47, 40, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 20px 20px 12px;
      border-bottom: 1px solid rgba(13, 143, 122, 0.12);
    }

    .header h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 12px 12px;
      background: var(--surface);
    }

    .tab {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px 4px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--muted);
      background: var(--tag-bg);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tab:hover {
      background: var(--accent-soft);
      color: var(--text);
    }

    .tab[aria-selected="true"] {
      background: var(--accent);
      color: #fff;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      padding: 0 16px 12px;
    }

    .toolbar--secondary {
      padding-top: 0;
      padding-bottom: 10px;
    }

    .btn-bulk-view {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      border: 1px dashed rgba(13, 143, 122, 0.45);
      background: linear-gradient(180deg, #f6fbf9, #eef6f3);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
    }

    .btn-bulk-view:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .btn-bulk-view:active {
      transform: scale(0.99);
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
    }

    .btn-add:hover {
      filter: brightness(1.05);
    }

    .btn-delete {
      background: var(--surface);
      color: var(--danger);
      border: 2px solid var(--danger-soft);
    }

    .btn-delete[data-active="true"] {
      background: var(--danger-soft);
      border-color: var(--danger);
    }

    .list-wrap {
      flex: 1;
      min-height: 0;
      padding: 0 16px 20px;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 420px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius);
    }

    .list::-webkit-scrollbar {
      width: 6px;
    }

    .list::-webkit-scrollbar-thumb {
      background: rgba(13, 143, 122, 0.35);
      border-radius: 3px;
    }

    .item {
      display: flex;
      align-items: stretch;
      gap: 0;
      background: var(--surface);
      border: 1px solid rgba(13, 143, 122, 0.15);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(13, 47, 40, 0.06);
    }

    .item-main {
      flex: 1;
      padding: 14px 16px;
      min-width: 0;
    }

    .item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .item-head .item-name-row {
      margin-bottom: 0;
      flex: 1;
      min-width: 0;
    }

    .btn-item-view-toggle {
      flex-shrink: 0;
      padding: 6px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      font-family: inherit;
      border-radius: 8px;
      border: 1px solid rgba(13, 143, 122, 0.35);
      background: var(--surface);
      color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-item-view-toggle:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .item-view-simple .item--detail-only {
      display: none;
    }

    .item-name-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .item-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      line-height: 1;
      background: linear-gradient(145deg, var(--accent-soft), #e8f5f1);
      border-radius: 10px;
      border: 1px solid rgba(13, 143, 122, 0.2);
      user-select: none;
    }

    .item-icon span {
      display: block;
      transform: translateY(1px);
    }

    .item-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0;
      flex: 1;
      min-width: 0;
    }

    .item-expiry {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-expiry strong {
      color: var(--text);
      font-weight: 600;
    }

    .item-expiry.unset {
      font-style: italic;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--tag-bg);
      color: var(--muted);
      font-weight: 600;
    }

    .stock-block {
      margin-top: 0;
      padding-top: 6px;
      border-top: 1px dashed rgba(13, 143, 122, 0.15);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }

    .stock-slider {
      flex: 1;
      min-width: 120px;
      width: auto;
      height: 32px;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }

    .stock-slider:focus {
      outline: none;
    }

    .stock-slider:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .stock-slider::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(
        90deg,
        #e8e8e8 0%,
        #e8e8e8 100%
      );
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .stock-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      margin-top: -9px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(13, 143, 122, 0.45);
      transition: transform 0.12s ease;
    }

    .stock-slider:active::-webkit-slider-thumb {
      transform: scale(1.08);
    }

    .stock-slider::-moz-range-track {
      height: 8px;
      border-radius: 4px;
      background: #e8e8e8;
    }

    .stock-slider::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(13, 143, 122, 0.45);
    }

    .stock-current {
      margin-top: 0;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      text-align: left;
      flex-shrink: 0;
      min-width: 5.5em;
    }

    .stock-current[data-level="0"] {
      color: #666;
    }

    .stock-current[data-level="1"] {
      color: #2a8f6e;
    }

    .stock-current[data-level="2"] {
      color: var(--accent);
    }

    .item-trash {
      display: none;
      align-items: center;
      justify-content: center;
      width: 52px;
      flex-shrink: 0;
      background: var(--danger-soft);
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      padding: 0;
      transition: background 0.15s;
    }

    .item-trash:hover {
      background: #fcc;
    }

    .list-wrap[data-delete-mode="true"] .item-trash {
      display: flex;
    }

    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="phone" role="application" aria-label="食品保管画面モック">
    <header class="header">
      <h1>食品保管</h1>
      <p>保管場所をタブで切り替え · 在庫はスライドで3段階 · 詳細はタグ・賞味期限を表示</p>
    </header>

    <div class="tabs" role="tablist" aria-label="保管場所">
      <button type="button" class="tab" role="tab" id="tab-fridge" aria-selected="true" aria-controls="panel-fridge" data-tab="fridge">冷蔵庫</button>
      <button type="button" class="tab" role="tab" id="tab-veg" aria-selected="false" aria-controls="panel-veg" data-tab="veg">野菜室</button>
      <button type="button" class="tab" role="tab" id="tab-freezer" aria-selected="false" aria-controls="panel-freezer" data-tab="freezer">冷凍庫</button>
      <button type="button" class="tab" role="tab" id="tab-pantry" aria-selected="false" aria-controls="panel-pantry" data-tab="pantry">パントリー</button>
    </div>

    <div class="toolbar">
      <button type="button" class="btn btn-add" id="btn-add" aria-label="食品を追加">＋ 食品追加</button>
      <button type="button" class="btn btn-delete" id="btn-delete" aria-pressed="false" data-active="false" aria-label="削除モード">削除</button>
    </div>

    <div class="toolbar toolbar--secondary">
      <button type="button" class="btn-bulk-view" id="btn-bulk-view" aria-label="すべての食品の表示を一括で切り替え">一括: 簡易表示</button>
    </div>

    <div class="list-wrap" id="list-wrap" data-delete-mode="false">
      <ul class="list" id="food-list" aria-live="polite"></ul>
    </div>
  </div>

  <script>
    (function () {
      var STOCK_LABELS = ['全くない', 'ちょっとある', '買ったばかり'];

      var initial = {
        fridge: [
          { id: '1', name: '牛乳', icon: '🥛', stockLevel: 2, expiry: '2026-04-08', tags: ['乳製品'] },
          { id: '2', name: '卵', icon: '🥚', stockLevel: 0, expiry: '2026-04-12', tags: ['卵'] },
          { id: '3', name: 'ハム', icon: '🥓', stockLevel: 1, expiry: '', tags: ['肉類', '加工品'] },
          { id: '4', name: '豆腐', icon: '🫘', stockLevel: 1, expiry: '2026-04-05', tags: ['大豆'] },
          { id: '5', name: 'ヨーグルト', icon: '🍦', stockLevel: 0, expiry: '2026-04-20', tags: ['乳製品'] },
        ],
        veg: [
          { id: '6', name: 'レタス', icon: '🥬', stockLevel: 1, expiry: '2026-04-04', tags: ['葉物野菜'] },
          { id: '7', name: 'トマト', icon: '🍅', stockLevel: 2, expiry: '', tags: ['果菜類'] },
          { id: '8', name: 'きゅうり', icon: '🥒', stockLevel: 0, expiry: '2026-04-06', tags: ['野菜'] },
          { id: '9', name: 'ほうれん草', icon: '🥬', stockLevel: 1, expiry: '2026-04-03', tags: ['葉物野菜'] },
        ],
        freezer: [
          { id: '10', name: '冷凍餃子', icon: '🥟', stockLevel: 1, expiry: '2026-08-01', tags: ['冷凍食品'] },
          { id: '11', name: '枝豆', icon: '🫛', stockLevel: 2, expiry: '2026-12-31', tags: ['野菜', '冷凍'] },
          { id: '12', name: '鶏もも肉', icon: '🍗', stockLevel: 0, expiry: '2026-05-15', tags: ['肉類'] },
        ],
        pantry: [
          { id: '13', name: '米', icon: '🍚', stockLevel: 2, expiry: '2026-10-01', tags: ['主食', '乾物'] },
          { id: '14', name: 'パスタ', icon: '🍝', stockLevel: 1, expiry: '', tags: ['主食'] },
          { id: '15', name: '缶詰（ツナ）', icon: '🥫', stockLevel: 0, expiry: '2027-01-15', tags: ['保存食'] },
          { id: '16', name: 'しょうゆ', icon: '🫗', stockLevel: 1, expiry: '', tags: ['調味料'] },
        ],
      };

      var items = JSON.parse(JSON.stringify(initial));
      var currentTab = 'fridge';
      var deleteMode = false;
      var nextId = 100;
      var globalViewMode = 'detail';

      var listEl = document.getElementById('food-list');
      var wrapEl = document.getElementById('list-wrap');
      var btnDelete = document.getElementById('btn-delete');
      var btnAdd = document.getElementById('btn-add');
      var btnBulkView = document.getElementById('btn-bulk-view');
      var tabButtons = document.querySelectorAll('.tab');

      function effectiveView(row) {
        return row.viewOverride != null ? row.viewOverride : globalViewMode;
      }

      function setEffectiveForRow(row, mode) {
        if (globalViewMode === mode) {
          row.viewOverride = null;
        } else {
          row.viewOverride = mode;
        }
      }

      function toggleRowView(row) {
        var eff = effectiveView(row);
        var next = eff === 'detail' ? 'simple' : 'detail';
        setEffectiveForRow(row, next);
      }

      function clearAllViewOverrides() {
        ['fridge', 'veg', 'freezer', 'pantry'].forEach(function (key) {
          items[key].forEach(function (r) {
            r.viewOverride = null;
          });
        });
      }

      function refreshBulkButton() {
        if (!btnBulkView) return;
        if (globalViewMode === 'detail') {
          btnBulkView.textContent = '一括: 簡易表示';
          btnBulkView.setAttribute(
            'aria-label',
            'すべての食品を簡易表示に切り替え（食材ごとの表示設定をリセット）'
          );
        } else {
          btnBulkView.textContent = '一括: 詳細表示';
          btnBulkView.setAttribute(
            'aria-label',
            'すべての食品を詳細表示に切り替え（食材ごとの表示設定をリセット）'
          );
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatExpiry(iso) {
        if (!iso || !String(iso).trim()) return null;
        var parts = String(iso).trim().split('-');
        if (parts.length !== 3) return String(iso);
        var y = parseInt(parts[0], 10);
        var m = parseInt(parts[1], 10);
        var d = parseInt(parts[2], 10);
        if (!y || !m || !d) return String(iso);
        return y + '年' + m + '月' + d + '日';
      }

      function expiryRowHtml(row) {
        var formatted = formatExpiry(row.expiry);
        if (formatted) {
          return (
            '<div class="item-expiry item--detail-only">賞味期限 <strong>' +
            escapeHtml(formatted) +
            '</strong></div>'
          );
        }
        return (
          '<div class="item-expiry unset item--detail-only">賞味期限 <strong>未設定</strong></div>'
        );
      }

      function getFoodIcon(row) {
        if (row.icon && String(row.icon).trim()) {
          return String(row.icon).trim();
        }
        var tagToIcon = {
          乳製品: '🥛',
          卵: '🥚',
          肉類: '🥩',
          加工品: '🥓',
          大豆: '🫘',
          葉物野菜: '🥬',
          果菜類: '🍅',
          野菜: '🥒',
          冷凍食品: '🥟',
          冷凍: '🧊',
          主食: '🍚',
          乾物: '🫘',
          保存食: '🥫',
          調味料: '🧂',
          その他: '🍽️',
        };
        var tags = row.tags || [];
        for (var i = 0; i < tags.length; i++) {
          if (tagToIcon[tags[i]]) return tagToIcon[tags[i]];
        }
        var name = String(row.name || '');
        if (/牛乳|ミルク/i.test(name)) return '🥛';
        if (/卵/i.test(name)) return '🥚';
        if (/豆腐|とうふ/i.test(name)) return '🫘';
        if (/ハム|ベーコン|ソーセージ/i.test(name)) return '🥓';
        if (/鶏|豚|牛|肉/i.test(name)) return '🍗';
        if (/野菜|レタス|キャベツ|ほうれん/i.test(name)) return '🥬';
        if (/トマト/i.test(name)) return '🍅';
        if (/きゅうり|cucumber/i.test(name)) return '🥒';
        if (/餃子|ギョーザ/i.test(name)) return '🥟';
        return '🍽️';
      }

      function iconCellHtml(row) {
        var sym = getFoodIcon(row);
        return (
          '<span class="item-icon" role="img" aria-hidden="true"><span>' +
          escapeHtml(sym) +
          '</span></span>'
        );
      }

      function bindStockSliders() {
        listEl.querySelectorAll('.stock-slider').forEach(function (slider) {
          function syncFromSlider() {
            var li = slider.closest('.item');
            var id = li && li.getAttribute('data-id');
            if (!id) return;
            var level = parseInt(slider.value, 10);
            if (isNaN(level)) level = 0;
            var row = null;
            for (var i = 0; i < items[currentTab].length; i++) {
              if (items[currentTab][i].id === id) {
                row = items[currentTab][i];
                break;
              }
            }
            if (!row) return;
            row.stockLevel = level;
            slider.setAttribute('aria-valuenow', String(level));
            slider.setAttribute('aria-valuetext', STOCK_LABELS[level]);
            slider.setAttribute('aria-label', '在庫の量: ' + STOCK_LABELS[level]);
            var cur = li.querySelector('.stock-current');
            if (cur) {
              cur.textContent = STOCK_LABELS[level];
              cur.setAttribute('data-level', String(level));
            }
          }
          slider.addEventListener('input', syncFromSlider);
          slider.addEventListener('change', syncFromSlider);
        });
      }

      function render() {
        var rows = items[currentTab] || [];
        if (rows.length === 0) {
          listEl.innerHTML = '<li class="empty">この保管場所に食品はありません</li>';
          refreshBulkButton();
          return;
        }

        listEl.innerHTML = rows
          .map(function (row) {
            var level = typeof row.stockLevel === 'number' ? row.stockLevel : 0;
            if (level < 0) level = 0;
            if (level > 2) level = 2;
            var eff = effectiveView(row);
            var viewClass = eff === 'simple' ? 'item-view-simple' : 'item-view-detail';
            var toggleLabel = eff === 'detail' ? '簡易' : '詳細';
            var toggleAria =
              eff === 'detail'
                ? escapeHtml(row.name) + 'を簡易表示に切り替え'
                : escapeHtml(row.name) + 'を詳細表示に切り替え';
            var tagsHtml = row.tags
              .map(function (t) {
                return '<span class="tag">' + escapeHtml(t) + '</span>';
              })
              .join('');
            return (
              '<li class="item ' +
              viewClass +
              '" data-id="' +
              escapeHtml(row.id) +
              '">' +
              '<div class="item-main">' +
              '<div class="item-head">' +
              '<div class="item-name-row">' +
              iconCellHtml(row) +
              '<div class="item-name">' +
              escapeHtml(row.name) +
              '</div></div>' +
              '<button type="button" class="btn-item-view-toggle" data-action="toggle-item-view" aria-label="' +
              toggleAria +
              '">' +
              toggleLabel +
              '</button>' +
              '</div>' +
              expiryRowHtml(row) +
              '<div class="item-meta item--detail-only">' +
              '<div class="tags">' +
              tagsHtml +
              '</div></div>' +
              '<div class="stock-block">' +
              '<input type="range" class="stock-slider" min="0" max="2" step="1" value="' +
              level +
              '" aria-label="在庫の量: ' +
              escapeHtml(STOCK_LABELS[level]) +
              '" aria-valuemin="0" aria-valuemax="2" aria-valuenow="' +
              level +
              '" />' +
              '<div class="stock-current" data-level="' +
              level +
              '">' +
              escapeHtml(STOCK_LABELS[level]) +
              '</div>' +
              '</div></div>' +
              '<button type="button" class="item-trash" aria-label="' +
              escapeHtml(row.name) +
              'を削除">🗑</button>' +
              '</li>'
            );
          })
          .join('');

        listEl.querySelectorAll('.item-trash').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var li = btn.closest('.item');
            var id = li && li.getAttribute('data-id');
            if (!id) return;
            items[currentTab] = items[currentTab].filter(function (r) {
              return r.id !== id;
            });
            render();
          });
        });

        listEl.querySelectorAll('[data-action="toggle-item-view"]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var li = btn.closest('.item');
            var id = li && li.getAttribute('data-id');
            if (!id) return;
            var row = null;
            for (var j = 0; j < items[currentTab].length; j++) {
              if (items[currentTab][j].id === id) {
                row = items[currentTab][j];
                break;
              }
            }
            if (!row) return;
            toggleRowView(row);
            render();
          });
        });

        bindStockSliders();
        refreshBulkButton();
      }

      function setTab(tab) {
        currentTab = tab;
        tabButtons.forEach(function (b) {
          var on = b.getAttribute('data-tab') === tab;
          b.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        render();
      }

      tabButtons.forEach(function (b) {
        b.addEventListener('click', function () {
          setTab(b.getAttribute('data-tab'));
        });
      });

      btnDelete.addEventListener('click', function () {
        deleteMode = !deleteMode;
        btnDelete.setAttribute('aria-pressed', deleteMode ? 'true' : 'false');
        btnDelete.setAttribute('data-active', deleteMode ? 'true' : 'false');
        wrapEl.setAttribute('data-delete-mode', deleteMode ? 'true' : 'false');
      });

      btnBulkView.addEventListener('click', function () {
        globalViewMode = globalViewMode === 'detail' ? 'simple' : 'detail';
        clearAllViewOverrides();
        render();
      });

      btnAdd.addEventListener('click', function () {
        var name = window.prompt('食品の名称を入力してください', '新しい食品');
        if (name === null || !String(name).trim()) return;
        var expiryRaw = window.prompt(
          '賞味期限を YYYY-MM-DD で入力（空なら未設定）',
          '2026-04-15'
        );
        var expiry = expiryRaw && String(expiryRaw).trim() ? String(expiryRaw).trim() : '';
        var tagInput = window.prompt('タグをカンマ区切りで（例: 野菜,葉物野菜）', 'その他');
        var tags =
          tagInput && String(tagInput).trim()
            ? String(tagInput)
                .split(',')
                .map(function (t) {
                  return t.trim();
                })
                .filter(Boolean)
            : ['その他'];
        var iconInput = window.prompt(
          '一覧に表示するアイコン（絵文字1つ。空ならタグ・名前から自動）',
          ''
        );
        var icon =
          iconInput && String(iconInput).trim() ? String(iconInput).trim() : undefined;
        var newItem = {
          id: String(nextId++),
          name: String(name).trim(),
          stockLevel: 1,
          expiry: expiry,
          tags: tags,
        };
        if (icon) newItem.icon = icon;
        items[currentTab].push(newItem);
        render();
      });

      setTab('fridge');
    })();
  </script>
</body>
</html>
