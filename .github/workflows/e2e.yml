name: E2E Tests (Android)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  detox-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # ubuntu-latest のイメージ更新でエミュレータ(qemu)が必要とする共有ライブラリ
      # (libpulse.so.0, libxkbfile.so.1 など)が同梱されなくなったため明示的にインストールする
      - name: Install emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxkbfile1 libgl1 libglu1-mesa \
            libxcursor1 libxrandr2 libxi6 libxtst6 libnss3 libasound2t64

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Detox APK (release)
        run: npm run test:detox:build:ci

      - name: Stop Gradle daemons to free memory
        run: cd android && ./gradlew --stop

      - name: Check available disk and memory
        run: |
          df -h /
          free -h

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          avd-name: Pixel_5_API_33
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: npm run test:detox:test:ci

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: artifacts/
          retention-days: 7
