name: E2E Tests (Android)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  detox-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Detox APK (release)
        run: npm run test:detox:build:ci

      - name: Stop Gradle daemons to free memory
        run: cd android && ./gradlew --stop

      - name: Check available disk and memory
        run: |
          df -h /
          free -h

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          avd-name: Pixel_5_API_33
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: |
            echo "=== Installing APKs ==="
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            echo "=== Verifying installation ==="
            adb shell pm list packages | grep fridgemanager || echo "WARNING: package not found"
            echo "=== Test instrumentation runner ==="
            adb shell pm list instrumentation | grep fridgemanager
            echo "=== Logcat (fatal/crash only) ==="
            adb logcat -c
            adb logcat -v time *:S AndroidRuntime:E DEBUG:V art:V fridgemanager:V detox:V > /tmp/logcat.txt 2>&1 &
            LOGCAT_PID=$!
            echo "=== Running E2E tests ==="
            npm run test:detox:test:ci || true
            sleep 3
            kill $LOGCAT_PID || true
            echo "=== Logcat output ==="
            cat /tmp/logcat.txt
            echo "=== am instrument test ==="
            adb shell pm list instrumentation
            adb shell am instrument -w com.clayfalcon.fridgemanager.test/androidx.test.runner.AndroidJUnitRunner &
            sleep 5
            adb shell ps -A | grep fridgemanager || echo "Process not found after manual instrument"
            kill %1 2>/dev/null || true

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: artifacts/
          retention-days: 7
